<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web-csv</title>
<style>
	body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
	textarea { width: 100%; font-family: ui-monospace, monospace; font-size: 0.9rem; }
	pre { background: #f4f4f4; padding: 0.75rem; overflow-x: auto; }
	#status { color: #555; }
	.row { margin: 0.75rem 0; }
</style>
</head>
<body>
	<h1>web-csv</h1>
	<p id="status">Loading interpreter...</p>

	<div class="row">
		<label for="csv-file">CSV file:</label>
		<input type="file" id="csv-file" accept=".csv">
	</div>

	<div class="row">
		<label for="query">Query (grammar-csv.txt syntax):</label><br>
		<textarea id="query" rows="7">let big := filter_gt(col("amount"), 100);
emit(sum(big));
emit(gpu_sum(col("amount")));
groupby(col("category"), col("amount"), "sum");</textarea>
	</div>

	<div class="row">
		<button id="run">Run</button>
		<button id="save">Save query</button>
	</div>

	<h2>Results</h2>
	<pre id="results">[]</pre>

	<script type="module" src="src/main.js"></script>
</body>
</html>
